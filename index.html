:root[data-theme=&quot;light&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

a:is(:hover, :focus-visible) {

h2,
h3,
h4,
h5,

}

b,
strong,

}

.table :is(th, td) {

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

.card {

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;

    calc(100vw - 10px)

  background: var(--popover);

  gap: 2px;

  font-weight: var(--font-weight-medium);

  align-items: center;

  background: var(--muted);

  background: var(--accent);

.text-muted {

  height: 1px;

  clip: rect(0, 0, 0, 0);

.viz-controls {

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

.btn,

.btn {

  align-items: center;

.btn:not(:disabled):hover {

  background: var(--foreground);

  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;

  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.btn:focus-visible {

}

  root.querySelectorAll(&#x27;.mh-tab&#x27;).forEach((tab) =&gt; {
    tab.addEventListener(&#x27;click&#x27;, () =&gt; {
      root.querySelectorAll(&#x27;.mh-tab&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === tab)));
      root.querySelectorAll(&#x27;.mh-panel&#x27;).forEach((panel) =&gt; { panel.hidden = panel.dataset.view !== tab.dataset.panel; });
    });
  });

  root.querySelectorAll(&#x27;.mh-view-button&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const isPlanned = button.dataset.plan === &#x27;planned&#x27;;
      root.querySelectorAll(&#x27;.mh-view-button&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
      const image = root.querySelector(&#x27;#mh-plan-image&#x27;);
      image.src = isPlanned ? planned : clean;
      image.alt = isPlanned ? &#x27;Annotated floorplan of apartment 2007 Bowie showing proposed furniture placement&#x27; : &#x27;Clean floorplan of apartment 2007 Bowie with room dimensions&#x27;;
    });
  });

  const storageKey = &#x27;bowie-move-planner-v1&#x27;;

  function readSaved() {
    try { return JSON.parse(localStorage.getItem(storageKey) || &#x27;{}&#x27;); }
    catch { return {}; }
  }

  function createTask(id, value, meta, checked = false, custom = true) {
    const li = document.createElement(&#x27;li&#x27;);
    li.className = &#x27;mh-task&#x27;;
    if (custom) li.dataset.custom = &#x27;true&#x27;;
    li.innerHTML = &#x27;&lt;input id=&quot;&#x27; + id + &#x27;&quot; type=&quot;checkbox&quot;&gt;&lt;label for=&quot;&#x27; + id + &#x27;&quot;&gt;&lt;/label&gt;&#x27;;
    li.querySelector(&#x27;input&#x27;).checked = checked;
    li.querySelector(&#x27;label&#x27;).append(document.createTextNode(value));
    const span = document.createElement(&#x27;span&#x27;);
    span.textContent = meta;
    li.querySelector(&#x27;label&#x27;).append(span);
    root.querySelector(&#x27;#mh-full-list&#x27;).append(li);
    return li;
  }

  function createInspiration(title, room, custom = true) {
    const article = document.createElement(&#x27;article&#x27;);
    article.className = &#x27;mh-inspo&#x27;;
    if (custom) {
      article.dataset.custom = &#x27;true&#x27;;
      article.dataset.title = title;
      article.dataset.room = room;
    }
    const visual = document.createElement(&#x27;div&#x27;);
    visual.className = &#x27;mh-inspo-visual&#x27;;
    visual.textContent = &#x27;Add a photo&#x27;;
    const copy = document.createElement(&#x27;div&#x27;);
    copy.className = &#x27;mh-inspo-copy&#x27;;
    const chip = document.createElement(&#x27;span&#x27;);
    chip.className = &#x27;mh-chip&#x27;;
    chip.textContent = room;
    const heading = document.createElement(&#x27;h3&#x27;);
    heading.textContent = title;
    const note = document.createElement(&#x27;p&#x27;);
    note.textContent = &#x27;New inspiration idea&#x27;;
    copy.append(chip, heading, note);
    article.append(visual, copy);
    root.querySelector(&#x27;#mh-inspo-grid&#x27;).prepend(article);
    return article;
  }

  function saveState() {
    const tasks = [...root.querySelectorAll(&#x27;#mh-full-list .mh-task&#x27;)].map((item) =&gt; ({
      id: item.querySelector(&#x27;input&#x27;).id,
      checked: item.querySelector(&#x27;input&#x27;).checked,
      custom: item.dataset.custom === &#x27;true&#x27;,
      title: item.querySelector(&#x27;label&#x27;).childNodes[0].textContent,
      meta: item.querySelector(&#x27;span&#x27;).textContent
    }));
    const inspiration = [...root.querySelectorAll(&#x27;#mh-inspo-grid .mh-inspo[data-custom=&quot;true&quot;]&#x27;)].map((item) =&gt; ({
      title: item.dataset.title,
      room: item.dataset.room
    }));
    try { localStorage.setItem(storageKey, JSON.stringify({ tasks, inspiration })); }
    catch { /* The preview still works when private browsing blocks storage. */ }
  }

  function restoreState() {
    const saved = readSaved();
    (saved.tasks || []).filter((task) =&gt; task.custom).forEach((task) =&gt; createTask(task.id, task.title, task.meta, task.checked));
    const states = new Map((saved.tasks || []).map((task) =&gt; [task.id, task.checked]));
    root.querySelectorAll(&#x27;#mh-full-list input[type=&quot;checkbox&quot;]&#x27;).forEach((input) =&gt; {
      if (states.has(input.id)) input.checked = states.get(input.id);
    });
    (saved.inspiration || []).forEach((idea) =&gt; createInspiration(idea.title, idea.room));
  }

  function updateProgress() {
    const tasks = [...root.querySelectorAll(&#x27;#mh-full-list input[type=&quot;checkbox&quot;]&#x27;)];
    const complete = tasks.filter((item) =&gt; item.checked).length;
    const percentage = Math.round((complete / tasks.length) * 100);
    root.querySelector(&#x27;#mh-complete-count&#x27;).textContent = complete;
    root.querySelector(&#x27;#mh-task-status&#x27;).textContent = complete + &#x27; of &#x27; + tasks.length + &#x27; complete&#x27;;
    root.querySelector(&#x27;#mh-meter&#x27;).style.width = percentage + &#x27;%&#x27;;
    root.querySelector(&#x27;#mh-progress-text&#x27;).textContent = percentage + &#x27;% complete&#x27;;
  }
  root.querySelector(&#x27;#mh-full-list&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; { updateProgress(); saveState(); });

  root.querySelector(&#x27;#mh-add-task&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const input = root.querySelector(&#x27;#mh-new-task&#x27;);
    const date = root.querySelector(&#x27;#mh-new-date&#x27;);
    const value = input.value.trim();
    if (!value) { input.focus(); return; }
    const id = &#x27;task-&#x27; + Date.now();
    createTask(id, value, date.value + &#x27; · Added by you&#x27;);
    input.value = &#x27;&#x27;;
    updateProgress();
    saveState();
  });

  root.querySelector(&#x27;#mh-open-inspo&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const form = root.querySelector(&#x27;#mh-inspo-form&#x27;);
    form.classList.toggle(&#x27;is-open&#x27;);
    if (form.classList.contains(&#x27;is-open&#x27;)) root.querySelector(&#x27;#mh-inspo-title&#x27;).focus();
  });

  root.querySelector(&#x27;#mh-save-inspo&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const title = root.querySelector(&#x27;#mh-inspo-title&#x27;);
    const room = root.querySelector(&#x27;#mh-inspo-room&#x27;);
    if (!title.value.trim()) { title.focus(); return; }
    createInspiration(title.value.trim(), room.value);
    title.value = &#x27;&#x27;;
    root.querySelector(&#x27;#mh-inspo-form&#x27;).classList.remove(&#x27;is-open&#x27;);
    saveState();
  });

  restoreState();
  updateProgress();
})();
